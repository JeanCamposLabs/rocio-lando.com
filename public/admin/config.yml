# =========================================================================
# Studio Manager (Decap CMS) configuration
# Lets Rocío add / edit works and projects through a visual form with
# drag-and-drop image upload. See HOW-TO-ADD-WORK.md for setup options.
# =========================================================================

# --- Where content is committed ---
backend:
  name: github
  repo: JeanCamposLabs/rocio-lando.com
  branch: main
  commit_messages:
    create: 'Add {{collection}} “{{slug}}” (via Studio Manager)'
    update: 'Update {{collection}} “{{slug}}” (via Studio Manager)'
    delete: 'Remove {{collection}} “{{slug}}” (via Studio Manager)'
    uploadMedia: 'Upload {{path}} (via Studio Manager)'
    deleteMedia: 'Delete {{path}} (via Studio Manager)'

# Lets the artist run the editor locally with `npx decap-server` (no login).
local_backend: true

# New uploads land in /public/works and are referenced as /works/<file>.
media_folder: 'public/works'
public_folder: '/works'

publish_mode: simple
site_url: https://rocio-lando.com
display_url: https://rocio-lando.com
logo_url: /site/icon-180.png

collections:
  # ----------------------------------------------------------------- WORKS
  - name: works
    label: 'Artworks'
    label_singular: 'Artwork'
    description: 'Every drawing in the gallery. Add a new one any time.'
    folder: 'src/content/works'
    create: true
    slug: '{{slug}}'
    sortable_fields: ['order', 'title', 'year']
    summary: '{{title}} · {{category}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - label: 'Image'
        name: 'image'
        widget: 'image'
        required: false
        hint: 'Upload the full-size scan/photo. Leave empty to create a “coming soon” slot.'
      - { label: 'Alt text (describe the image for SEO & screen readers)', name: 'alt', widget: 'string', required: false }
      - label: 'Category'
        name: 'category'
        widget: 'select'
        default: 'architecture'
        options:
          - { label: 'Architecture', value: 'architecture' }
          - { label: 'Watercolour', value: 'watercolor' }
          - { label: 'Animals', value: 'animals' }
          - { label: 'Botanical', value: 'botanical' }
          - { label: 'Travel', value: 'travel' }
      - { label: 'Medium', name: 'medium', widget: 'string', default: 'Pen & ink on paper' }
      - { label: 'Year', name: 'year', widget: 'number', required: false, value_type: 'int', min: 1990, max: 2100 }
      - { label: 'Location', name: 'location', widget: 'string', required: false }
      - { label: 'Short description / caption', name: 'description', widget: 'text', required: false }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false, default: [] }
      - { label: 'Feature this piece (shows first)', name: 'featured', widget: 'boolean', default: false }
      - { label: 'Order (lower shows earlier)', name: 'order', widget: 'number', default: 100, value_type: 'int' }
      - { label: 'Coming-soon placeholder', name: 'placeholder', widget: 'boolean', default: false, required: false }
      - { label: 'Hide / draft', name: 'draft', widget: 'boolean', default: false, required: false }

  # -------------------------------------------------------------- PROJECTS
  - name: projects
    label: 'Projects & Series'
    label_singular: 'Project'
    description: 'Larger collaborations or ongoing series.'
    folder: 'src/content/projects'
    create: true
    slug: '{{slug}}'
    sortable_fields: ['order', 'title', 'year']
    media_folder: '/public/projects'
    public_folder: '/projects'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Summary', name: 'summary', widget: 'text' }
      - { label: 'Cover image', name: 'cover', widget: 'image' }
      - label: 'Gallery images'
        name: 'images'
        widget: 'list'
        required: false
        fields:
          - { label: 'Image', name: 'src', widget: 'image' }
          - { label: 'Alt text', name: 'alt', widget: 'string', required: false }
      - { label: 'Category', name: 'category', widget: 'string', default: 'Series' }
      - { label: 'Year', name: 'year', widget: 'number', required: false, value_type: 'int' }
      - { label: 'Role', name: 'role', widget: 'string', required: false }
      - { label: 'Collaborator', name: 'collaborator', widget: 'string', required: false }
      - { label: 'Collaborator link', name: 'collaboratorUrl', widget: 'string', required: false }
      - { label: 'External link', name: 'link', widget: 'string', required: false }
      - { label: 'Feature this project', name: 'featured', widget: 'boolean', default: true }
      - { label: 'Order', name: 'order', widget: 'number', default: 100, value_type: 'int' }
      - { label: 'Hide / draft', name: 'draft', widget: 'boolean', default: false, required: false }
      - { label: 'Case-study notes (optional)', name: 'body', widget: 'markdown', required: false }

  # -------------------------------------------------------- SITE SETTINGS
  - name: settings
    label: 'Site Text & Contact'
    delete: false
    editor: { preview: false }
    files:
      - name: 'site'
        label: 'Profile, contact, FAQ & more'
        file: 'src/data/site.json'
        description: 'Headline, bio, email, social links, FAQ, services.'
        fields:
          - { label: 'Name', name: 'name', widget: 'string' }
          - { label: 'Role', name: 'role', widget: 'string' }
          - { label: 'Location', name: 'location', widget: 'string' }
          - { label: 'Contact email', name: 'email', widget: 'string' }
          - label: 'SEO'
            name: 'seo'
            widget: 'object'
            fields:
              - { label: 'Page title', name: 'title', widget: 'string' }
              - { label: 'Meta description', name: 'description', widget: 'text' }
              - { label: 'OG image path', name: 'ogImage', widget: 'string' }
          - label: 'Hero'
            name: 'hero'
            widget: 'object'
            fields:
              - { label: 'Kicker', name: 'kicker', widget: 'string' }
              - { label: 'Headline (two lines)', name: 'headline', widget: 'list' }
              - { label: 'Intro', name: 'intro', widget: 'text' }
              - { label: 'Scroll label', name: 'scrollLabel', widget: 'string' }
          - { label: 'Disciplines (marquee)', name: 'disciplines', widget: 'list' }
          - label: 'About'
            name: 'about'
            widget: 'object'
            fields:
              - { label: 'Kicker', name: 'kicker', widget: 'string' }
              - { label: 'Heading', name: 'heading', widget: 'text' }
              - { label: 'Paragraphs (use *word* for accent)', name: 'paragraphs', widget: 'list' }
              - { label: 'Signature', name: 'signature', widget: 'string' }
              - { label: 'Portrait image path', name: 'portrait', widget: 'string' }
              - { label: 'Portrait alt', name: 'portraitAlt', widget: 'string' }
          - label: 'Stats'
            name: 'stats'
            widget: 'list'
            fields:
              - { label: 'Value', name: 'value', widget: 'string' }
              - { label: 'Label', name: 'label', widget: 'string' }
          - label: 'Process steps'
            name: 'process'
            widget: 'list'
            fields:
              - { label: 'No.', name: 'no', widget: 'string' }
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'text' }
          - label: 'Commissions'
            name: 'commissions'
            widget: 'object'
            fields:
              - { label: 'Kicker', name: 'kicker', widget: 'string' }
              - { label: 'Heading', name: 'heading', widget: 'text' }
              - { label: 'Items', name: 'items', widget: 'list' }
          - label: 'FAQ'
            name: 'faqs'
            widget: 'list'
            fields:
              - { label: 'Question', name: 'q', widget: 'string' }
              - { label: 'Answer', name: 'a', widget: 'text' }
          - label: 'Social links'
            name: 'socials'
            widget: 'list'
            fields:
              - { label: 'Label', name: 'label', widget: 'string' }
              - { label: 'Handle', name: 'handle', widget: 'string' }
              - { label: 'URL', name: 'url', widget: 'string' }
          - label: 'Navigation'
            name: 'nav'
            widget: 'list'
            fields:
              - { label: 'Label', name: 'label', widget: 'string' }
              - { label: 'Href', name: 'href', widget: 'string' }
          - label: 'Credits'
            name: 'credits'
            widget: 'object'
            fields:
              - { label: 'Year', name: 'year', widget: 'number', value_type: 'int' }
              - { label: 'Note', name: 'builtNote', widget: 'text' }
